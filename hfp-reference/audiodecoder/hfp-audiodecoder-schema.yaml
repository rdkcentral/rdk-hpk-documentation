# Pykwalify schema for audio decoder capabilities
# Enforces codec-specific profile validation
# Schema Version: 1.0.0

type: map
mapping:
  audiodecoder:
    type: map
    required: true
    mapping:
      interfaceVersion:
        type: str
        required: true

      schemaVersion:
        type: str
        required: true
        pattern: '^\d+\.\d+\.\d+$'

      Capabilities:
        type: seq
        required: true
        sequence:
          - type: map
            matching: "any"
            mapping:
              regex;(^\d+$):
                type: map
                mapping:
                  codecCapabilities:
                    type: seq
                    required: true
                    sequence:
                      - type: map
                        mapping:
                          PCM:
                            type: map
                            mapping:
                              profiles:
                                type: seq
                                required: true
                                range:
                                  min: 1
                                sequence:
                                  - type: map
                                    matching: "any"
                                    mapping:
                                      regex;(^(BASE)$):
                                        type: map
                                        mapping:
                                          maxBitrateInBps:
                                            type: number
                                            required: true
                                          maxChannels:
                                            type: int
                                            required: true
                                          maxSampleRateInHz:
                                            type: int
                                            required: true
                                          maxBitDepth:
                                            type: int
                                            required: true

                          AAC:
                            type: map
                            mapping:
                              profiles:
                                type: seq
                                required: true
                                range:
                                  min: 1
                                sequence:
                                  - type: map
                                    matching: "any"
                                    mapping:
