      codec: H264_AVC
      profile: H264_MAIN
      maxLevel: H264_LEVEL_5_2
      dynamicRange: [SDR, HLG, HDR10, HDR10PLUS, DOLBY_VISION]

    - nodeId: d1_h264_high
      decoder: 1
      codec: H264_AVC
      profile: H264_HIGH
      maxLevel: H264_LEVEL_5_2
      dynamicRange: [SDR, HLG, HDR10, HDR10PLUS, DOLBY_VISION]

    - nodeId: d1_h265_main
