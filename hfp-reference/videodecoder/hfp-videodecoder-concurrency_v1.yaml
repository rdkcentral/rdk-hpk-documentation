      profile: VP9_PROFILE_3
      maxLevel: VP9_LEVEL_6_2
      dynamicRange: [SDR, HLG, HDR10, HDR10PLUS]

    - nodeId: d1_av1_main
      decoder: 1
      codec: AV1
      profile: AV1_MAIN
      maxLevel: AV1_LEVEL_6_2
      dynamicRange: [SDR, HLG, HDR10, HDR10PLUS, DOLBY_VISION]

    - nodeId: d1_av1_high
      decoder: 1
      codec: AV1
      profile: AV1_HIGH
      maxLevel: AV1_LEVEL_6_2
      dynamicRange: [SDR, HLG, HDR10, HDR10PLUS, DOLBY_VISION]

  # Allowed combinations (edges in the MW concurrency graph).
  # Each entry is a pair of node IDs that can run concurrently.
  # MW builds directed edges from these; getProperties uses them to prune.
